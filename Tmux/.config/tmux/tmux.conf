set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# ─── UI / Theme ───────────────────────────────────────────────────────────────
# Match the main status bar to Ghostty's background and foreground
set -g status-style bg="#0d1117",fg="#e6edf3"

# Command message styling
set -g message-style bg="#58a6ff",fg="#0d1117"

# Pane border styling
set -g pane-border-style fg="#484f58"
set -g pane-active-border-style fg="#58a6ff"

# ─── Keybindings & Core ───────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ─── Powerline-style status bar ───────────────────────────────────────────────
set -g status-position bottom
set -g status-left-length 60
set -g status-right-length 80

# LEFT: [ session name ]
# Merged with the active window block using a thin chevron ()
set -g status-left "#[bg=#58a6ff,fg=#0d1117,bold] #S #[bg=#0d1117,fg=#58a6ff]#[default] "
# WINDOWS: inactive
set -g window-status-format "#[bg=#0d1117,fg=#e6edf3] #I:#W "

# WINDOWS: active — blue accent with chevrons
# Caps off the merged left side with the solid arrow ()
set -g window-status-current-format "#[bg=#58a6ff,fg=#0d1117,bold]#I:#W #[bg=#0d1117,fg=#58a6ff]#[default]"

# RIGHT: Date only in dd/mm/yyyy format
set -g status-right "#[fg=#484f58,bg=#0d1117]#[fg=#e6edf3,bg=#484f58] %d/%m/%Y "

# Separator between windows in the center
set -g window-status-separator ""

# ─── Plugins & Addons ─────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi

# copy mode keybindings
bind-key -T prefix C-v copy-mode -e
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Cht.Sh 
bind-key -T prefix C-s new-window "~/Code/bash/ChtII.sh"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
